# Load production env: cp .env.prod.example .env.prod && fill in values
# Run: docker-compose -f docker-compose.prod.yml --env-file .env.prod up -d --build

services:
  gateway:
    build:
      context: ./gateway
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    env_file:
      - ./backend/.env
    environment:
      - GATEWAY_PORT=8080
      - ENVIRONMENT=production
      - PYTHON_BACKEND_URL=http://backend:8000
      - REDIS_URL=redis://:${REDIS_PASSWORD}@redis:6379/0
      - RATE_LIMIT_ENABLED=true
      - RATE_LIMIT_RPS=200
    depends_on:
      - backend
      - redis
    restart: always

  db:
    image: postgres:15-alpine
    volumes:
      - postgres_data:/var/lib/postgresql/data
    environment:
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
    restart: always

  mongodb:
    image: mongo:7.0
    volumes:
      - mongodb_data:/data/db
    environment:
      - MONGO_INITDB_ROOT_USERNAME=${MONGO_USER}
      - MONGO_INITDB_ROOT_PASSWORD=${MONGO_PASSWORD}
    restart: always
    deploy:
      resources:
        limits:
          memory: 1G
          cpus: '1'

  redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD}
    volumes:
      - redis_data:/data
    restart: always

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    volumes:
      - minio_data:/data
    environment:
      - MINIO_ROOT_USER=${MINIO_ROOT_USER}
      - MINIO_ROOT_PASSWORD=${MINIO_ROOT_PASSWORD}
    ports:
      - "9001:9001"  # MinIO console only (optional, remove if not needed)
    restart: always

  backend:
    image: omnirag-backend
    build:
      context: ./backend
      dockerfile: Dockerfile
      network: host
    dns:
      - 8.8.8.8
      - 8.8.4.4
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000
    env_file:
      - ./backend/.env
    volumes:
      - huggingface_cache:/app/.cache/huggingface
    depends_on:
      - db
      - mongodb
      - redis
      - minio
      - qdrant
      - opendataloader-hybrid
    restart: always
    deploy:
      resources:
        limits:
          memory: 4G
          cpus: '2'

  celery_worker:
    image: omnirag-backend
    dns:
      - 8.8.8.8
      - 8.8.4.4
    command: celery -A app.worker worker --loglevel=info
    env_file:
      - ./backend/.env
    volumes:
      - huggingface_cache:/app/.cache/huggingface
    depends_on:
      - db
      - mongodb
      - redis
      - minio
      - qdrant
      - opendataloader-hybrid
    restart: always
    deploy:
      resources:
        limits:
          memory: 2G
          cpus: '1'

  opendataloader-hybrid:
    build:
      context: ./backend
      dockerfile: Dockerfile.hybrid
    ports:
      - "5002:5002"
    restart: always
    # Uncomment for NVIDIA GPU:
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           capabilities: [gpu]

  qdrant:
    image: qdrant/qdrant:v1.7.0
    volumes:
      - qdrant_data:/qdrant/storage
    restart: always
    deploy:
      resources:
        limits:
          memory: 2G
          cpus: '1'

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.prod
      args:
        - VITE_API_URL=${VITE_API_URL}
        - VITE_WS_URL=${VITE_WS_URL}
    ports:
      - "80:80"
    depends_on:
      - gateway
    restart: always

volumes:
  postgres_data:
  mongodb_data:
  redis_data:
  minio_data:
  qdrant_data:
  huggingface_cache:
