# ─── Production Override (minimal) ────────────────────────────────────────
# Usage: docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d --build
#
# This file ONLY overrides what differs from local dev. The base
# docker-compose.yml provides all service definitions and defaults.
#
# Set production values in .env (gitignored, never committed):
#   CORS_ORIGINS=http://YOUR_IP:5173,http://...
#   OPENROUTER_SITE_URL=http://YOUR_IP:5173
#   VITE_EXTRA_HOSTS=IP1,IP2

services:
  gateway:
    environment:
      - ENVIRONMENT=production
      - CORS_ALLOWED_ORIGINS=${CORS_ORIGINS}
      - OPENROUTER_SITE_URL=${OPENROUTER_SITE_URL}
    restart: always

  backend:
    restart: always
    deploy:
      resources:
        limits:
          memory: 4G
          cpus: '2'

  celery_worker:
    restart: always
    deploy:
      resources:
        limits:
          memory: 2G
          cpus: '1'

  frontend:
    environment:
      - VITE_EXTRA_HOSTS=${VITE_EXTRA_HOSTS}
    restart: always

  db:
    restart: always

  redis:
    restart: always

  mongodb:
    restart: always
    deploy:
      resources:
        limits:
          memory: 1G
          cpus: '1'

  minio:
    restart: always

  qdrant:
    restart: always
    deploy:
      resources:
        limits:
          memory: 2G
          cpus: '1'

  opendataloader-hybrid:
    restart: always

  fb-channel-worker:
    restart: always

  zalo-personal-worker:
    restart: always
