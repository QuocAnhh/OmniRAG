# ─── Production Override ──────────────────────────────────────────────────
# Usage: docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d --build
# Set production values in .env (gitignored):
#   CORS_ORIGINS=http://...:5173,http://...:5173
#   OPENROUTER_SITE_URL=http://<YOUR_IP>:5173
#   VITE_EXTRA_HOSTS=<IP1>,<IP2>

services:
  gateway:
    build:
      context: ./gateway
      dockerfile: Dockerfile
    ports:
      - "${GATEWAY_HOST_PORT:-8080}:8080"
    env_file:
      - ./backend/.env
    environment:
      - GATEWAY_PORT=8080
      - ENVIRONMENT=production
      - PYTHON_BACKEND_URL=http://backend:8000
      - REDIS_URL=redis://:${REDIS_PASSWORD}@redis:6379/0
      - RATE_LIMIT_ENABLED=true
      - RATE_LIMIT_RPS=200
      # Production overrides (from .env)
      - CORS_ALLOWED_ORIGINS=${CORS_ORIGINS}
      - OPENROUTER_SITE_URL=${OPENROUTER_SITE_URL}
    depends_on:
      - backend
      - redis
    restart: always

  db:
    image: postgres:15-alpine
    volumes:
      - postgres_data:/var/lib/postgresql/data
    environment:
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
    restart: always

  mongodb:
    image: mongo:7.0
    volumes:
      - mongodb_data:/data/db
    environment:
      - MONGO_INITDB_ROOT_USERNAME=${MONGO_USER}
      - MONGO_INITDB_ROOT_PASSWORD=${MONGO_PASSWORD}
    restart: always
    deploy:
      resources:
        limits:
          memory: 1G
          cpus: '1'

  redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD}
    volumes:
      - redis_data:/data
    restart: always

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    volumes:
      - minio_data:/data
    environment:
      - MINIO_ROOT_USER=${MINIO_ROOT_USER}
      - MINIO_ROOT_PASSWORD=${MINIO_ROOT_PASSWORD}
    ports:
      - "${MINIO_CONSOLE_HOST_PORT:-9001}:9001"  # MinIO console only (optional, remove if not needed)
    restart: always

  backend:
    image: omnirag-backend
    build:
      context: ./backend
      dockerfile: Dockerfile
      network: host
    dns:
      - 8.8.8.8
      - 8.8.4.4
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000
    env_file:
      - ./backend/.env
    environment:
      - ZALO_PERSONAL_ENABLED=${ZALO_PERSONAL_ENABLED:-false}
      - ZALO_PERSONAL_WORKER_URL=http://zalo-personal-worker:9200
      - ZALO_PERSONAL_WORKER_API_TOKEN=${ZALO_PERSONAL_WORKER_API_TOKEN:-}
      - ZALO_PERSONAL_INBOUND_SECRET=${ZALO_PERSONAL_INBOUND_SECRET:-}
    volumes:
      - huggingface_cache:/app/.cache/huggingface
    depends_on:
      - db
      - mongodb
      - redis
      - minio
      - qdrant
      - opendataloader-hybrid
    restart: always
    deploy:
      resources:
        limits:
          memory: 4G
          cpus: '2'

  celery_worker:
    image: omnirag-backend
    dns:
      - 8.8.8.8
      - 8.8.4.4
    command: celery -A app.worker worker --loglevel=info
    env_file:
      - ./backend/.env
    volumes:
      - huggingface_cache:/app/.cache/huggingface
    depends_on:
      - db
      - mongodb
      - redis
      - minio
      - qdrant
      - opendataloader-hybrid
    restart: always
    deploy:
      resources:
        limits:
          memory: 2G
          cpus: '1'

  opendataloader-hybrid:
    build:
      context: ./backend
      dockerfile: Dockerfile.hybrid
    ports:
      - "${PDF_HYBRID_HOST_PORT:-5002}:5002"
    environment:
      - PDF_HYBRID_FORCE_OCR=${PDF_HYBRID_FORCE_OCR:-false}
      - PDF_HYBRID_OCR_ENGINE=${PDF_HYBRID_OCR_ENGINE:-auto}
      - PDF_HYBRID_OCR_LANG=${PDF_HYBRID_OCR_LANG:-}
      - PDF_HYBRID_DEVICE=${PDF_HYBRID_DEVICE:-cpu}
      - PDF_HYBRID_MAX_FILE_SIZE=${PDF_HYBRID_MAX_FILE_SIZE:-}
      - PDF_HYBRID_ENRICH_PICTURE=${PDF_HYBRID_ENRICH_PICTURE:-false}
      - PDF_HYBRID_ENRICH_FORMULA=${PDF_HYBRID_ENRICH_FORMULA:-false}
    restart: always
    # Uncomment for NVIDIA GPU:
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           capabilities: [gpu]

  # ─── fb-channel-worker (GPL v3 isolated microservice) ───────────────────
  fb-channel-worker:
    build: ./services/fb-channel-worker
    image: omnirag-fb-channel-worker
    restart: always
    env_file:
      - ./backend/.env
    expose:
      - "9100"
    environment:
      - BACKEND_URL=http://backend:8000
      - WORKER_API_TOKEN=${FB_WORKER_API_TOKEN:-}
      - INBOUND_SECRET=${FB_INBOUND_SECRET:-}
      - LOG_LEVEL=INFO
    depends_on:
      - backend
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9100/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '0.5'

  # ─── zalo-personal-worker (experimental unofficial zca-js microservice) ──
  zalo-personal-worker:
    build: ./services/zalo-personal-worker
    image: omnirag-zalo-personal-worker
    restart: always
    expose:
      - "9200"
    volumes:
      - zalo_personal_sessions:/sessions
    environment:
      - BACKEND_URL=http://backend:8000
      - WORKER_API_TOKEN=${ZALO_PERSONAL_WORKER_API_TOKEN:-}
      - INBOUND_SECRET=${ZALO_PERSONAL_INBOUND_SECRET:-}
      - LOG_LEVEL=info
    depends_on:
      - backend
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9200/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '0.5'

  qdrant:
    image: qdrant/qdrant:v1.16.0
    volumes:
      - qdrant_data:/qdrant/storage
    restart: always
    deploy:
      resources:
        limits:
          memory: 2G
          cpus: '1'

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.prod
      args:
        - VITE_API_URL=${VITE_API_URL}
        - VITE_WS_URL=${VITE_WS_URL}
        - VITE_ENABLE_ZALO_PERSONAL=${VITE_ENABLE_ZALO_PERSONAL:-false}
    ports:
      - "${FRONTEND_HOST_PORT:-80}:80"
    environment:
      - VITE_EXTRA_HOSTS=${VITE_EXTRA_HOSTS}
    depends_on:
      - gateway
    restart: always

volumes:
  postgres_data:
  mongodb_data:
  redis_data:
  minio_data:
  qdrant_data:
  huggingface_cache:
  zalo_personal_sessions:
