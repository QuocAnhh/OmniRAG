# ─── Production Override (minimal) ────────────────────────────────────────
# Usage: docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d --build
#
# The base docker-compose.yml is already secure by default: it publishes only
# the gateway and the frontend, and requires every credential via ${VAR:?}.
# This file adds restart policies and resource limits on top.
#
# It is deliberately NOT the security boundary. An earlier version was expected
# to close the datastore ports, but the documented launch command in README.md
# loads the base file alone — so anything fixed only here never took effect.
# Keep hardening in the base file.
#
# Set production values in .env (gitignored, never committed):
#   cp .env.example .env
#   CORS_ORIGINS=https://your-domain
#   OPENROUTER_SITE_URL=https://your-domain

services:
  gateway:
    environment:
      - CORS_ALLOWED_ORIGINS=${CORS_ORIGINS}
      - OPENROUTER_SITE_URL=${OPENROUTER_SITE_URL}
    restart: always

  backend:
    restart: always
    deploy:
      resources:
        limits:
          memory: 4G
          cpus: '2'

  celery_worker:
    restart: always
    deploy:
      resources:
        limits:
          memory: 2G
          cpus: '1'

  frontend:
    environment:
      - VITE_EXTRA_HOSTS=${VITE_EXTRA_HOSTS}
    restart: always

  db:
    restart: always

  redis:
    restart: always

  mongodb:
    restart: always
    deploy:
      resources:
        limits:
          memory: 1G
          cpus: '1'

  minio:
    restart: always

  qdrant:
    restart: always
    deploy:
      resources:
        limits:
          memory: 2G
          cpus: '1'

  opendataloader-hybrid:
    restart: always

  fb-channel-worker:
    restart: always

  zalo-personal-worker:
    restart: always
