[build-system]
requires = ["hatchling>=1.21.0"]
build-backend = "hatchling.build"

[project]
name = "fb-channel-worker"
version = "0.1.0"
description = "OmniRAG Facebook Messenger channel worker. Isolated GPL v3 microservice."
license = { text = "GPL-3.0-or-later" }
requires-python = ">=3.11"
dependencies = [
    "fbchat-muqit>=1.2.2",
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "httpx>=0.27.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.5.0",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]
