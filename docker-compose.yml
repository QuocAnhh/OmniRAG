services:
  gateway:
    build: ./gateway
    ports:
      - "8080:8080"
    environment:
      - GATEWAY_PORT=8080
      - ENVIRONMENT=development
      - PYTHON_BACKEND_URL=http://backend:8000
      - REDIS_URL=redis://redis:6379/0
      - RATE_LIMIT_ENABLED=true
      - RATE_LIMIT_RPS=100
      - CORS_ALLOWED_ORIGINS=http://localhost:5173,http://localhost:3000,https://2hlx32dn-5173.asse.devtunnels.ms
    depends_on:
      - backend
      - redis
    restart: unless-stopped

  db:
    image: postgres:15-alpine
    restart: unless-stopped
    volumes:
      - postgres_data:/var/lib/postgresql/data
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=password
      - POSTGRES_DB=omnirag
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d omnirag"]
      interval: 5s
      timeout: 5s
      retries: 10

  mongodb:
    image: mongo:7.0
    restart: unless-stopped
    volumes:
      - mongodb_data:/data/db
    environment:
      - MONGO_INITDB_ROOT_USERNAME=admin
      - MONGO_INITDB_ROOT_PASSWORD=password
    ports:
      - "27017:27017"

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    ports:
      - "6380:6379"

  minio:
    image: minio/minio:latest
    restart: unless-stopped
    command: server /data --console-address ":9001"
    volumes:
      - minio_data:/data
    environment:
      - MINIO_ROOT_USER=minioadmin
      - MINIO_ROOT_PASSWORD=minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"

  backend:
    build: ./backend
    image: omnirag-backend
    restart: unless-stopped
    command: sh -c "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000"
    volumes:
      - ./backend:/app
      - huggingface_cache:/app/.cache/huggingface
    ports:
      - "8001:8000"
    environment:
      - POSTGRES_SERVER=db
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=password
      - POSTGRES_DB=omnirag
      - MONGODB_URL=mongodb://admin:password@mongodb:27017
      - REDIS_URL=redis://redis:6379/0
      - MINIO_ENDPOINT=minio:9000
      - MINIO_ACCESS_KEY=minioadmin
      - MINIO_SECRET_KEY=minioadmin
      - QDRANT_HOST=qdrant
      - QDRANT_URL=http://qdrant:6333
      - HF_HOME=/app/.cache/huggingface
      - LIGHTRAG_LLM_MODEL=openai/gpt-4.1-mini
      - PDF_TABLE_METHOD=cluster
      - PDF_IMAGE_OUTPUT=external
      - PDF_HYBRID_MODE=docling-fast
      - PDF_HYBRID_URL=http://opendataloader-hybrid:5002
      - ZALO_PERSONAL_ENABLED=${ZALO_PERSONAL_ENABLED:-false}
      - ZALO_PERSONAL_WORKER_URL=http://zalo-personal-worker:9200
      - ZALO_PERSONAL_WORKER_API_TOKEN=${ZALO_PERSONAL_WORKER_API_TOKEN:-}
      - ZALO_PERSONAL_INBOUND_SECRET=${ZALO_PERSONAL_INBOUND_SECRET:-}
    depends_on:
      db:
        condition: service_healthy
      mongodb:
        condition: service_started
      redis:
        condition: service_started
      minio:
        condition: service_started
      qdrant:
        condition: service_started
      opendataloader-hybrid:
        condition: service_started

  celery_worker:
    image: omnirag-backend
    restart: unless-stopped
    command: celery -A app.worker worker --loglevel=info --concurrency=4
    volumes:
      - ./backend:/app
      - huggingface_cache:/app/.cache/huggingface
    environment:
      - POSTGRES_SERVER=db
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=password
      - POSTGRES_DB=omnirag
      - MONGODB_URL=mongodb://admin:password@mongodb:27017
      - REDIS_URL=redis://redis:6379/0
      - MINIO_ENDPOINT=minio:9000
      - MINIO_ACCESS_KEY=minioadmin
      - MINIO_SECRET_KEY=minioadmin
      - QDRANT_HOST=qdrant
      - QDRANT_URL=http://qdrant:6333
      - HF_HOME=/app/.cache/huggingface
      - LIGHTRAG_LLM_MODEL=openai/gpt-4.1-mini
      - PDF_TABLE_METHOD=cluster
      - PDF_IMAGE_OUTPUT=external
      - PDF_HYBRID_MODE=docling-fast
      - PDF_HYBRID_URL=http://opendataloader-hybrid:5002
    depends_on:
      - db
      - mongodb
      - redis
      - minio
      - qdrant
      - opendataloader-hybrid

  # ─────────────────────────────────────────────────────────────────────────
  # fb-channel-worker — Facebook Messenger bridge (GPL v3 isolated microservice)
  # Uses unofficial fbchat-muqit library; isolated from backend to avoid GPL
  # license entanglement. Communicates with backend over HTTP only.
  # See services/fb-channel-worker/README.md for details.
  # ─────────────────────────────────────────────────────────────────────────
  fb-channel-worker:
    build: ./services/fb-channel-worker
    image: omnirag-fb-channel-worker
    restart: unless-stopped
    env_file:
      - ./backend/.env
    expose:
      - "9100"
    environment:
      - BACKEND_URL=http://backend:8000
      - WORKER_API_TOKEN=${FB_WORKER_API_TOKEN:-}
      - INBOUND_SECRET=${FB_INBOUND_SECRET:-}
      - LOG_LEVEL=INFO
    depends_on:
      backend:
        condition: service_started
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9100/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  # ─────────────────────────────────────────────────────────────────────────
  # zalo-personal-worker — Zalo personal account bridge (unofficial zca-js)
  # Experimental. Use a dedicated Zalo account and do not open Zalo Web/PC with
  # that same account while the listener is running.
  # ─────────────────────────────────────────────────────────────────────────
  zalo-personal-worker:
    build: ./services/zalo-personal-worker
    image: omnirag-zalo-personal-worker
    restart: unless-stopped
    expose:
      - "9200"
    volumes:
      - zalo_personal_sessions:/sessions
    environment:
      - BACKEND_URL=http://backend:8000
      - WORKER_API_TOKEN=${ZALO_PERSONAL_WORKER_API_TOKEN:-}
      - INBOUND_SECRET=${ZALO_PERSONAL_INBOUND_SECRET:-}
      - LOG_LEVEL=INFO
    depends_on:
      backend:
        condition: service_started
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9200/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  qdrant:
    image: qdrant/qdrant:latest
    restart: unless-stopped
    ports:
      - "6333:6333"
    volumes:
      - qdrant_data:/qdrant/storage

  # ─────────────────────────────────────────────────────────────────────────
  #   brew install ollama && ollama serve
  #   ollama pull qwen2.5:14b
  # ─────────────────────────────────────────────────────────────────────────
  # ollama:
  #   image: ollama/ollama:latest
  #   ports:
  #     - "11434:11434"
  #   volumes:
  #     - ollama_data:/root/.ollama
  #   restart: unless-stopped
  #   entrypoint: ["/bin/sh", "-c", "ollama serve & sleep 5 && ollama pull ${LIGHTRAG_LLM_MODEL:-qwen2.5:14b} && wait"]
  #   environment:
  #     - LIGHTRAG_LLM_MODEL=${LIGHTRAG_LLM_MODEL:-qwen2.5:14b}
  #   # Uncomment for NVIDIA GPU:
  #   # deploy:
  #   #   resources:
  #   #     reservations:
  #   #       devices:
  #   #         - driver: nvidia
  #   #           capabilities: [gpu]

  # ─────────────────────────────────────────────────────────────────────────
  #   OpenDataLoader Hybrid Server (OCR, formulas, SmolVLM image descriptions)
  #   Enable: uncomment below + set PDF_HYBRID_MODE=docling-fast in env
  # ─────────────────────────────────────────────────────────────────────────
  opendataloader-hybrid:
    build:
      context: ./backend
      dockerfile: Dockerfile.hybrid
    ports:
      - "5002:5002"
    restart: unless-stopped

  frontend:
    build: ./frontend
    restart: unless-stopped
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    environment:
      - VITE_BACKEND_URL=http://backend:8000
      - VITE_API_URL=http://localhost:8080
      - VITE_ENABLE_ZALO_PERSONAL=${VITE_ENABLE_ZALO_PERSONAL:-false}
    depends_on:
      - gateway

volumes:
  postgres_data:
  mongodb_data:
  redis_data:
  minio_data:
  qdrant_data:
  huggingface_cache:
  ollama_data:
  zalo_personal_sessions:
