# gitleaks configuration
#
# Keep this file narrow. Every entry below is a documented false positive with
# a path and a pattern, never a blanket rule or a whole-directory exclusion —
# a secret scanner that has been quieted into always passing is worse than none.

[extend]
useDefault = true

# Note: single false positives are suppressed with an inline `gitleaks:allow`
# comment at the offending line rather than a rule here. That syntax is stable
# across gitleaks versions — the CI action pins 8.24.3 while local installs are
# newer, and the top-level allowlist schema differs between them — and it keeps
# the justification visible to anyone reading the code.

[[allowlists]]
description = "Template files hold CHANGE_ME placeholders by design."
paths = [
  '''\.env\.example''',
  '''\.env\.prod\.example''',
]

[[allowlists]]
description = """
Documentation and tests quote redaction sentinels and example values so the \
security rules stay legible and testable.
"""
regexTarget = "line"
regexes = [
  '''__REDACTED__''',
  '''CHANGE_ME''',
  '''openssl rand -hex''',
]
